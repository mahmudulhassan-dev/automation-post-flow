services:
  db:
    image: postgres:16-alpine
    container_name: amanaflow-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-amanaflow}
      POSTGRES_USER: ${POSTGRES_USER:-amanaflow_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me_strong}
    volumes:
      - amanaflow-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-amanaflow_user} -d ${POSTGRES_DB:-amanaflow}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: amanaflow-redis
    restart: unless-stopped
    command: ["redis-server", "--save", "60", "1", "--appendonly", "yes"]
    volumes:
      - amanaflow-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: docker/api/Dockerfile
    container_name: amanaflow-api
    restart: unless-stopped
    environment:
      PORT: 8080
      DATABASE_URL: ${DATABASE_URL:-postgresql://amanaflow_user:change_me_strong@db:5432/amanaflow}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      ADMIN_TOKEN: ${ADMIN_TOKEN:-change_this_admin_token}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8080:8080"

  worker:
    build:
      context: .
      dockerfile: docker/worker/Dockerfile
    container_name: amanaflow-worker
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://amanaflow_user:change_me_strong@db:5432/amanaflow}
      AUTO_RENEW_MODE: ${AUTO_RENEW_MODE:-issue}
      WORKER_TICK_MS: 60000
    depends_on:
      db:
        condition: service_healthy
      api:
        condition: service_started

  web:
    image: nginx:1.27-alpine
    container_name: amanaflow-web
    restart: unless-stopped
    depends_on:
      api:
        condition: service_started
    ports:
      - "8088:80"
    volumes:
      - ./web:/usr/share/nginx/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  amanaflow-db-data:
  amanaflow-redis-data:
